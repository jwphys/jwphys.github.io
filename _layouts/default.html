<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="ink-bg"></div>
  <div class="container">
    <header class="site-header">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>
        <nav class="site-nav" id="siteNav">
          <a href="{{ '/' | relative_url }}" data-i18n="nav.home">Home</a>
          <a href="{{ '/research/' | relative_url }}" data-i18n="nav.research">Research</a>
          <a href="{{ '/publications/' | relative_url }}" data-i18n="nav.publications">Publications</a>
          <a href="{{ '/projects/' | relative_url }}" data-i18n="nav.projects">Projects</a>
          <a href="{{ '/notes/' | relative_url }}" data-i18n="nav.notes">Study Notes</a>
        </nav>
        <button class="lang-toggle" id="langToggle" data-i18n="footer.lang_toggle">中 / EN</button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      </div>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p data-i18n="footer.copyright">© 2026 Jiwen Chen. All rights reserved.</p>
    </footer>
  </div>

  <script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>

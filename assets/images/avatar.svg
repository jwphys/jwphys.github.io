<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="100" fill="#faf8f5"/>
  <!-- Bear doll face -->
  <circle cx="100" cy="95" r="50" fill="#d4a574"/>
  <!-- Ears -->
  <circle cx="60" cy="55" r="18" fill="#d4a574"/>
  <circle cx="60" cy="55" r="10" fill="#e8c4a0"/>
  <circle cx="140" cy="55" r="18" fill="#d4a574"/>
  <circle cx="140" cy="55" r="10" fill="#e8c4a0"/>
  <!-- Inner face -->
  <circle cx="100" cy="100" r="38" fill="#e8c4a0"/>
  <!-- Eyes -->
  <circle cx="82" cy="90" r="5" fill="#2c2c2c"/>
  <circle cx="118" cy="90" r="5" fill="#2c2c2c"/>
  <!-- Eye shine -->
  <circle cx="84" cy="88" r="2" fill="white"/>
  <circle cx="120" cy="88" r="2" fill="white"/>
  <!-- Nose -->

  <!-- Mouth -->
  <path d="M94 112 Q100 120 106 112" stroke="#2c2c2c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Glasses (scholar vibe) -->
  <circle cx="82" cy="90" r="16" fill="none" stroke="#5b8a72" stroke-width="1.5"/>
  <circle cx="118" cy="90" r="16" fill="none" stroke="#5b8a72" stroke-width="1.5"/>
  <line x1="98" y1="90" x2="102" y2="90" stroke="#5b8a72" stroke-width="1.5"/>
</svg>

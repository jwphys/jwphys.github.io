home:
  title: "Jiwen Chen"
  subtitle: "PhD Student"
  affiliation: "Westlake University"
  bio: >
    I am a PhD student at Westlake University, working under the supervision of
    Prof. Yan Zhou. My research focuses on interacting quantum many-body systems,
    particularly quantum magnetism and phase transitions of spin systems, using
    stochastic series expansion quantum Monte Carlo (SSE QMC) algorithms.
    I am also interested in magnetic skyrmions, domain-wall bimerons, and their
    current-driven dynamics.
  email: "chenjiwen@westlake.edu.cn"
  google_scholar: ""
  orcid: ""


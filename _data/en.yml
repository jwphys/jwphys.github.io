research:
  title: "Research Interests"
  items:
    - title: "Quantum Magnetism & Spin Systems"
      description: >
        Investigating phase transitions and critical phenomena in quantum
        spin systems using stochastic series expansion quantum Monte Carlo
        (SSE QMC) simulations.
      icon: "🧲"
    - title: "Magnetic Skyrmions & Bimerons"
      description: >
        Studying topological magnetic textures such as skyrmions and
        domain-wall bimerons, and their current-driven dynamics for
        next-generation spintronic devices.
      icon: "🌀"
    - title: "Computational Condensed Matter"
      description: >
        Developing and applying numerical methods — including QMC,
        micromagnetic simulations, and atomistic spin dynamics — to
        understand emergent phenomena in correlated materials.
      icon: "💻"
    - title: "Spintronics"
      description: >
        Exploring the interplay between spin transport, magnetization
        dynamics, and topological spin textures for energy-efficient
        information storage and processing.
      icon: "⚡"


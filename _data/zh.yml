research:
  title: "研究方向"
  items:
    - title: "量子磁性与自旋系统"
      description: >
        利用随机级数展开量子蒙特卡洛（SSE QMC）模拟方法研究
        量子自旋系统的相变和临界现象。
      icon: "🧲"
    - title: "磁性斯格明子与双半子"
      description: >
        研究斯格明子和畴壁双半子等拓扑磁性结构，以及它们的
        电流驱动动力学，为下一代自旋电子学器件提供理论基础。
      icon: "🌀"
    - title: "计算凝聚态物理"
      description: >
        开发和应用数值方法——包括量子蒙特卡洛、微磁模拟和
        原子自旋动力学——来理解关联材料中的涌现现象。
      icon: "💻"
    - title: "自旋电子学"
      description: >
        探索自旋输运、磁化动力学与拓扑自旋结构之间的相互作用，
        以实现高能效的信息存储与处理。
      icon: "⚡"


home:
  title: "陈集文"
  subtitle: "博士研究生"
  affiliation: "西湖大学"
  bio: >
    我是西湖大学的博士研究生，导师为郑毅教授。我的研究方向集中于相互作用量子多体系统，
    特别是量子磁性和自旋系统的相变问题，使用随机级数展开量子蒙特卡洛（SSE QMC）算法
    进行研究。同时，我也对磁性斯格明子、畴壁双半子（domain-wall bimerons）及其
    电流驱动动力学感兴趣。
  email: "chenjiwen@westlake.edu.cn"

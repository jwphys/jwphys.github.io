name: Fetch Publications

on:
  schedule:
    - cron: '0 0 * * 0'  # weekly on Sunday
  workflow_dispatch:      # manual trigger

jobs:
  fetch-pubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Fetch publications from Google Scholar
        run: |
          python .github/scripts/fetch_publications.py
        env:
          SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: update publications" && git push)

---
layout: page
title: Study Notes
i18n: notes.title
---
<p data-i18n="notes.subtitle">{{ site.data[site.lang].notes.subtitle }}</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li class="post-item">
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <div class="meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>
      {% if post.tags %}
        {% for tag in post.tags %}
          <a href="{{ '/notes/tags/' | relative_url }}#{{ tag | slugify }}" class="tag">{{ tag }}</a>
        {% endfor %}
      {% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
